name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version-file: "plantilla-cd/pyproject.toml"

      - name: Install dependencies
        working-directory: plantilla-cd
        run: uv sync --all-extras --dev

      - name: Run ruff
        working-directory: plantilla-cd
        run: uv run ruff check .

      - name: Run tests with coverage
        working-directory: plantilla-cd
        run: uv run pytest --cov=src/plantilla --cov-report=term-missing --cov-report=xml
